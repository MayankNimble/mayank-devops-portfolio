<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mayank | DevOps Engineer</title>

<style>
* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #3b3f8c, #0a0d2e);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

/* background floating text */
.bg-text {
  position: fixed;
  font-size: 120px;
  opacity: 0.05;
  font-weight: 800;
  pointer-events: none;
}
.bg1 { top: 10%; left: 5%; }
.bg2 { bottom: 10%; right: 5%; }

/* layout */
.container {
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
  padding: 20px;
}

/* glass card */
.card {
  width: 320px;
  padding: 25px;
  border-radius: 20px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

/* profile */
.avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  margin: auto;
  display: block;
  border: 3px solid #5ac8fa;
}

h1 {
  text-align: center;
  margin: 15px 0 5px;
}

.role {
  text-align: center;
  opacity: 0.85;
  margin-bottom: 15px;
}

/* skills */
.skills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.skill {
  padding: 6px 12px;
  border-radius: 20px;
  background: rgba(255,255,255,0.25);
  font-size: 13px;
}

/* api box */
.api-box {
  width: 320px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #5ac8fa;
  color: #000;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 12px;
}

pre {
  background: rgba(0,0,0,0.3);
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
  max-height: 220px;
  overflow: auto;
}

/* mobile */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<div class="bg-text bg1">Kubernetes</div>
<div class="bg-text bg2">Linux</div>

<div class="container">

  <!-- Profile -->
  <div class="card">
    <img class="avatar" src="https://i.pravatar.cc/150?img=3" />
    <h1>Mayank</h1>
    <div class="role">DevOps Engineer</div>

    <div class="skills">
      <div class="skill">AWS</div>
      <div class="skill">Linux</div>
      <div class="skill">Docker</div>
      <div class="skill">Terraform</div>
      <div class="skill">Ansible</div>
      <div class="skill">CI/CD</div>
    </div>
  </div>

  <!-- API -->
  <div class="card api-box">
    <h2>Live Serverless API</h2>
    <p style="opacity:0.8">API Gateway + Lambda (Python)</p>

    <button onclick="fetchAPI()">Fetch Live Data</button>

    <pre id="output">Waiting for request…</pre>
  </div>

</div>

<script>
const API_URL = "PASTE_YOUR_API_GATEWAY_INVOKE_URL_HERE";

async function fetchAPI() {
  const output = document.getElementById("output");
  output.textContent = "Loading...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({})
    });

    if (!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();
    output.textContent = JSON.stringify(data, null, 2);

  } catch (err) {
    output.textContent = "API connection failed ❌\n" + err.message;
  }
}
</script>

</body>
</html>
