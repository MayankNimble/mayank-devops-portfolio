<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayank | DevOps Portfolio</title>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.25);
      --text-main: #ffffff;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #312e81, #020617);
      overflow-x: hidden;
      color: var(--text-main);
    }

    /* ===== FLOATING BACKGROUND TEXT ===== */
    .floating-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-bg span {
      position: absolute;
      color: rgba(255,255,255,0.08);
      font-size: 40px;
      animation: float 30s linear infinite;
      white-space: nowrap;
    }

    @keyframes float {
      from {
        transform: translateY(110vh);
      }
      to {
        transform: translateY(-120vh);
      }
    }

    /* ===== LAYOUT ===== */
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
      align-items: center;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .floating-bg span {
        display: none; /* mobile = clean */
      }
    }

    /* ===== GLASS CARD ===== */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    /* ===== PROFILE ===== */
    .profile {
      text-align: center;
    }

    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      object-fit: cover;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 6px;
    }

    .subtitle {
      opacity: 0.85;
      margin-bottom: 18px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .tag {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(56,189,248,0.15);
      border: 1px solid rgba(56,189,248,0.4);
      font-size: 13px;
    }

    /* ===== API SECTION ===== */
    h2 {
      font-size: 22px;
      margin-bottom: 10px;
      color: var(--accent);
    }

    button {
      margin-top: 14px;
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #020617;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    .api-output {
      margin-top: 16px;
      background: rgba(0,0,0,0.35);
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <!-- FLOATING BACKGROUND WORDS -->
  <div class="floating-bg">
    <span style="left:10%; animation-delay:0s;">AWS</span>
    <span style="left:30%; animation-delay:5s;">Docker</span>
    <span style="left:50%; animation-delay:10s;">Kubernetes</span>
    <span style="left:70%; animation-delay:15s;">Terraform</span>
    <span style="left:20%; animation-delay:20s;">Linux</span>
    <span style="left:60%; animation-delay:25s;">DevOps</span>
  </div>

  <div class="container">

    <!-- PROFILE CARD -->
    <div class="glass profile">
      <img src="profile.jpg" alt="Mayank" />
      <h1>Mayank</h1>
      <p class="subtitle">DevOps Engineer</p>

      <div class="tags">
        <div class="tag">AWS</div>
        <div class="tag">Linux</div>
        <div class="tag">Docker</div>
        <div class="tag">Terraform</div>
        <div class="tag">Ansible</div>
        <div class="tag">CI/CD</div>
      </div>
    </div>

    <!-- API CARD -->
    <div class="glass">
      <h2>Live Serverless API</h2>
      <p class="subtitle">
        Powered by API Gateway + Lambda (Python)
      </p>

      <button onclick="loadAPI()">Fetch Live Data</button>

      <div id="api" class="api-output">
        Loading API data...
      </div>
    </div>

  </div>

  <!-- API SCRIPT -->
  <script>
    async function loadAPI() {
      const box = document.getElementById("api");
      box.textContent = "Loading...";

      try {
        const res = await fetch(
          "https://8vbo6nk6s9.execute-api.us-east-1.amazonaws.com/dev",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            }
          }
        );

        const data = await res.json();
        box.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        box.textContent = "API connection failed";
        console.error(err);
      }
    }

    loadAPI();
  </script>

</body>
</html>
