<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mayank | DevOps Engineer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #2d2f8f, #0a0d2b);
      color: #fff;
      overflow-x: hidden;
    }

    /* Floating background text */
    .bg-text {
      position: fixed;
      font-size: 140px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.05);
      user-select: none;
      pointer-events: none;
    }

    .bg-k8s { top: 8%; left: 5%; }
    .bg-linux { bottom: 10%; right: 5%; }
    .bg-aws { top: 45%; right: 20%; }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .cards {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .glass {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      padding: 32px;
      width: 320px;
      transition: transform 0.3s ease;
    }

    .glass:hover {
      transform: translateY(-6px);
    }

    .profile img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #7dd3fc;
      object-fit: cover;
      margin-bottom: 18px;
    }

    .profile h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .profile p {
      opacity: 0.85;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .skill {
      padding: 7px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .info h2 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #7dd3fc;
    }

    .info p {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .cta {
      margin-top: 22px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s ease;
    }

    .cta:hover {
      opacity: 0.85;
    }

    @media (max-width: 768px) {
      .bg-text {
        font-size: 90px;
      }
    }
  </style>
</head>

<body>

  <!-- Floating background words -->
  <div class="bg-text bg-k8s">Kubernetes</div>
  <div class="bg-text bg-linux">Linux</div>
  <div class="bg-text bg-aws">AWS</div>

  <div class="container">
    <div class="cards">

      <!-- Profile Card -->
      <div class="glass profile">
        <img src="https://i.imgur.com/8Km9tLL.jpg" alt="Profile">
        <h1>Mayank</h1>
        <p>DevOps Engineer</p>

        <div class="skills">
          <span class="skill">AWS</span>
          <span class="skill">Linux</span>
          <span class="skill">Docker</span>
          <span class="skill">Kubernetes</span>
          <span class="skill">Terraform</span>
          <span class="skill">Ansible</span>
          <span class="skill">CI/CD</span>
        </div>
      </div>

      <!-- About Card -->
      <div class="glass info">
        <h2>About Me</h2>
        <p>
          Passionate DevOps Engineer focused on building scalable, reliable,
          and automated cloud infrastructure. Strong hands-on experience with
          AWS, containerization, and infrastructure as code.
        </p>

        <button class="cta">Download Resume</button>
      </div>

    </div>
  </div>

</body>
</html>
